<svg xmlns="http://www.w3.org/2000/svg" width="900" height="258" viewBox="0 0 900 258" role="img" aria-labelledby="t d">
  <title id="t">Profile Views — painel ASCII animado</title>
  <desc id="d">Painel em arte ASCII com barras de progresso, equalizador, varredura e indicadores em cinza e azul escuro.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="258">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#101c33"/>
    </linearGradient>
    <linearGradient id="edge" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="900" y2="0">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="45%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#475569"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="-900 0" dur="9s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0"/>
      <stop offset="50%" stop-color="#2563eb" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="panelClip"><rect x="6" y="6" width="888" height="246" rx="16"/></clipPath>
  </defs>
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, 'Cascadia Mono', Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace; white-space: pre; }
    .head { font-size: 15px; fill: #94a3b8; }
    .meta { font-size: 13px; fill: #64748b; }
    .rule { font-size: 13px; fill: #24344f; }
    .icon { font-size: 14px; font-weight: 700; }
    .label { font-size: 13px; fill: #cbd5e1; letter-spacing: 1.1px; }
    .bar  { font-size: 14px; letter-spacing: 1px; }
    .live { font-size: 11px; fill: #64748b; letter-spacing: .6px; }
    .cur  { fill: #cbd5e1; animation: curBlink 1.05s steps(1, end) infinite; }
    .dot  { animation: dotPulse 1.6s ease-in-out infinite; }
    .spin { animation: spin 1.2s steps(4, end) infinite; }
    .scan { animation: scan 4.2s cubic-bezier(.4,0,.6,1) infinite; }
    .eq   { transform-box: fill-box; transform-origin: center bottom; animation: eqPulse 1.05s ease-in-out infinite alternate; }
    @keyframes curBlink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    @keyframes dotPulse { 0%, 100% { opacity: .35; r: 3; } 50% { opacity: 1; r: 4.2; } }
    @keyframes spin { 0% { opacity: 1; } 24% { opacity: 1; } 25% { opacity: 0; } 100% { opacity: 0; } }
    @keyframes scan { 0% { transform: translateY(-40px); } 100% { transform: translateY(240px); } }
    @keyframes eqPulse { from { transform: scaleY(.28); } to { transform: scaleY(1); } }
    @media (prefers-reduced-motion: reduce) {
      .cur, .dot, .spin, .scan, .eq { animation: none; }
      .bar { fill: #94a3b8 !important; }
      .scan { opacity: 0; }
    }
  </style>
  <rect x="6" y="6" width="888" height="246" rx="16" fill="url(#panel)" stroke="url(#edge)" stroke-width="1.6"/>
  <g clip-path="url(#panelClip)">
    <rect class="scan" x="6" y="0" width="888" height="46" fill="url(#scan)"/>
  </g>
