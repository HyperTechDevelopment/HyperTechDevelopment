<svg xmlns="http://www.w3.org/2000/svg" width="427" height="131" viewBox="0 0 427.35 131.6" role="img" aria-labelledby="t-stack d-stack">
  <title id="t-stack">STACK — atalho de navegação em arte ASCII</title>
  <desc id="d-stack">A palavra STACK desenhada em arte ASCII, com brilho animado em cinza e azul escuro.</desc>
  <defs>
    <linearGradient id="sheen-stack" gradientUnits="userSpaceOnUse" spreadMethod="repeat" x1="0" y1="0" x2="427.35" y2="0">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="28%" stop-color="#94a3b8"/>
      <stop offset="55%" stop-color="#2563eb"/>
      <stop offset="78%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#475569"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="-427.35 0" dur="6.5s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>
  <style>
    .art {
      font-family: ui-monospace, SFMono-Regular, 'Cascadia Mono', Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace;
      font-size: 15.5px;
      white-space: pre;
      fill: url(#sheen-stack);
      opacity: 0;
      animation: rowIn .48s cubic-bezier(.2,.7,.3,1) both;
    }
    .cur { fill: #94a3b8; animation: curBlink 1.05s steps(1, end) infinite; }
    @keyframes rowIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes curBlink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .art { fill: #94a3b8; animation: none; opacity: 1; }
      .cur { animation: none; opacity: 1; }
    }
  </style>
  <g text-anchor="start">
    <text class="art" x="22.0" y="28.4" xml:space="preserve" style="animation-delay:0.00s">███████╗████████╗ █████╗  ██████╗██╗  ██╗</text>
    <text class="art" x="22.0" y="45.0" xml:space="preserve" style="animation-delay:0.07s">██╔════╝╚══██╔══╝██╔══██╗██╔════╝██║ ██╔╝</text>
    <text class="art" x="22.0" y="61.6" xml:space="preserve" style="animation-delay:0.14s">███████╗   ██║   ███████║██║     █████╔╝</text>
    <text class="art" x="22.0" y="78.2" xml:space="preserve" style="animation-delay:0.21s">╚════██║   ██║   ██╔══██║██║     ██╔═██╗</text>
    <text class="art" x="22.0" y="94.8" xml:space="preserve" style="animation-delay:0.28s">███████║   ██║   ██║  ██║╚██████╗██║  ██╗</text>
    <text class="art" x="22.0" y="111.4" xml:space="preserve" style="animation-delay:0.35s">╚══════╝   ╚═╝   ╚═╝  ╚═╝ ╚═════╝╚═╝  ╚═╝</text>
  </g>
  <rect class="cur" x="409.35" y="113.6" width="6.73" height="3.2" rx="1"/>
</svg>
