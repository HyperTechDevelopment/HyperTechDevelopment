      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="35%" stop-color="#06b6d4"/>
      <stop offset="65%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#2563eb"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="-1128 0" dur="14s" repeatCount="indefinite"/>
    </linearGradient>
    <clipPath id="typeClip">
