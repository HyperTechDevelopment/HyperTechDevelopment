  <style>
    .art {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace;
      font-size: 10px;
      white-space: pre;
      fill: url(#sheen);
      opacity: 0;
      animation: rowIn .5s cubic-bezier(.2,.7,.3,1) both;
    }
    .name {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace;
      font-size: 15px;
      white-space: pre;
      fill: url(#sheen);
      opacity: 0;
      animation: rowIn .5s cubic-bezier(.2,.7,.3,1) both;
    }
    .tag {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace;
      font-size: 13px;
      white-space: pre;
      fill: #64748b;
    }
    @keyframes rowIn { from { opacity: 0; transform: translateY(7px); } to { opacity: 1; transform: translateY(0); } }
    #typeRect { animation: type 1.1s steps(22, end) 2.15s forwards; }
    @keyframes type { from { width: 0; } to { width: 172px; } }
    #cursor { opacity: 0; animation: blink 1s 3.3s infinite; }
    @keyframes blink { 0%, 50% { opacity: 1; } 50.01%, 100% { opacity: 0; } }
    @media (prefers-color-scheme: light) { .tag { fill: #475569; } }
  </style>
